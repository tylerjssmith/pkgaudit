url: https://tylerjssmith.github.io/pkgaudit/
template:
  bootstrap: 5

reference:
- title: "Scanning a package"
  desc: >
    The entry points. Both return a pkgaudit object: what was found, and what
    the scan made of every file it could identify as code.
  contents:
  - audit_package
  - audit_tarball
- title: "Reading a result"
  contents:
  - print.pkgaudit
  - summary.pkgaudit
- title: "Carrying a result to another tool"
  desc: >
    R is parsed and shell is matched as text; everything else is handed on.
  contents:
  - emit_sarif
  - export_unscanned
- title: "Rules"
  desc: >
    The rules are data, not code, and ship in a hash-verified database.
  contents:
  - load_rules
  - rules_version
- title: "Provenance"
  contents:
  - hash_manifest
  - validate_tar

articles:
- title: "Articles"
  navbar: ~
  contents:
  - pkgaudit
  - r-package-security
  - rules
  - internals
