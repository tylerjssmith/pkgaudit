# .github/workflows/rules-db.yaml
# The README publishes two things about inst/db/rules.db that do not travel with
# it: the rule set's version and its SHA-256. Both are computed at knit time from
# README.Rmd, so both go stale whenever the database is rebuilt without
# re-rendering -- and a stale value tells a user following the documented
# procedure that the database has been tampered with, or that they are running
# rules other than the ones they are reading about. This fails the build instead.
name: Rules DB

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hash:
    name: Published hash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare the published hash against the shipped database
        shell: bash
        run: |
          set -euo pipefail

          db="inst/db/rules.db"
          [ -f "$db" ] || { echo "::error::$db not found"; exit 1; }

          actual=$(sha256sum "$db" | cut -d' ' -f1)

          # The published value is the one following "Expected SHA-256:".
          # Anchoring on that label rather than on any 64-hex string keeps
          # example output elsewhere in the README from being read as the claim.
          # Newlines are flattened first: pandoc wraps the label onto its own
          # line, so the label and the hash are not reliably adjacent.
          published=$(tr '\n' ' ' < README.md \
                      | grep -oE 'Expected SHA-256: *`[a-f0-9]{64}`' \
                      | grep -oE '[a-f0-9]{64}' || true)

          if [ -z "$published" ]; then
            echo "::error::No 'Expected SHA-256:' line found in README.md."
            echo "Re-knit README.Rmd; the integrity section is expected to publish one."
            exit 1
          fi

          echo "published: $published"
          echo "database:  $actual"

          if [ "$published" != "$actual" ]; then
            echo "::error::README.md publishes a stale rules-database hash."
            echo "Re-knit README.Rmd with rmarkdown::render(\"README.Rmd\") and commit README.md."
            exit 1
          fi

          # The sidecar load_rules() verifies on every call must agree too, or a
          # correct README would sit alongside a database that refuses to load.
          if [ -f "$db.sha256" ]; then
            sidecar=$(tr -d '[:space:]' < "$db.sha256")
            echo "sidecar:   $sidecar"
            if [ "$sidecar" != "$actual" ]; then
              echo "::error::$db.sha256 does not match $db."
              echo "Rebuild with Rscript inst/scripts/build_db.R and commit both."
              exit 1
            fi
          else
            echo "::error::$db.sha256 not found; load_rules() would refuse the database."
            exit 1
          fi

          echo "README, sidecar and database agree."

  version:
    name: Published version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          needs: check

      # The claim is about what a user's rules_version() will return, so the
      # package is installed and the function is called, rather than the query
      # behind it being restated here where it could drift from R/load_rules.R.
      - name: Compare the published version against rules_version()
        shell: bash
        run: |
          set -euo pipefail
          R CMD INSTALL --preclean --no-multiarch .
          Rscript tools/readme_version.R
