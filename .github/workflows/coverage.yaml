on:
  push:
    branches: [main, master]
  pull_request:

name: coverage

permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Compute coverage and render badge
        id: coverage
        run: Rscript tools/coverage.R

      - name: Publish badge
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          set -e
          cp public/coverage.svg /tmp/coverage.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clean -fdx
          if git fetch origin badges:badges; then
            git checkout badges
          else
            git checkout --orphan badges
            git rm -rf . >/dev/null 2>&1 || true
          fi
          cp /tmp/coverage.svg coverage.svg
          git add coverage.svg
          git commit -m "Update coverage badge [skip ci]" || echo "No change"
          git push origin badges

      - name: Enforce coverage threshold
        env:
          PCT: ${{ steps.coverage.outputs.pct }}
        run: |
          awk -v pct="$PCT" 'BEGIN {
            if (pct < 80) {
              printf "Coverage %.2f%% is below the 80%% threshold\n", pct
              exit 1
            }
            printf "Coverage %.2f%% meets the 80%% threshold\n", pct
          }'
