# .github/workflows/osv-scanner.yaml
# This workflow targets R vulnerabilities. See dependency-review.yaml for
# workflow targeting GitHub Actions vulnerabilities.

# Note: This workflow limits OSV-Scanner to the R package dependencies in the
# renv lock file associated with the default profile, reflecting the
# dependencies needed to use the package.
name: OSV-Scanner

on:
  schedule:
    - cron: "30 12 * * 1" # Every Monday at 12:30pm UTC
  push:
    branches: [main, master]

permissions:
  # Required to upload SARIF file to CodeQL.
  actions: read
  # Required for writing security events to upload SARIF file to security tab
  security-events: write
  # Only need to read contents
  contents: read

jobs:
  osv-scanner:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      # Scan only the default profile's lockfile. Overrides the action default
      # ("-r ./"), which would also walk the repo and pick up
      # renv/profiles/dev/renv.lock.
      scan-args: |-
        --lockfile=renv.lock
