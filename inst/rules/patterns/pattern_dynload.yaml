name: dynload
version: "0.3.0"
type: R
attck:
  - T1129
message: >-
  dyn.load() and library.dynam() load compiled code from a shared object, which
  executes outside the visible R source.
xpath: >-
  //SYMBOL_FUNCTION_CALL[
    (text() = 'dyn.load' or text() = 'library.dynam')
    and not(preceding-sibling::OP-DOLLAR)
    and not(preceding-sibling::OP-AT)
  ]
positive_examples:
  - |
    dyn.load("evil.so")
  - |
    dyn.load(file.path(tempdir(), "payload.so"))
  - |
    library.dynam("evil", pkgname, libname)
  - |
    base::dyn.load("evil.so")
negative_examples:
  - |
    foo$dyn.load("x")
  - |
    foo@dyn.load("x")
  - |
    foo$library.dynam("x")
  - |
    foo@library.dynam("x")
