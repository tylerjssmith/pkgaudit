name: credentials
version: "0.1.0"
language: R
attck:
  - T1552.001
  - T1552.004
message: >-
  A path or environment variable that only exists to hold a secret. Nothing a
  package needs in order to install or load lives in these, and package code
  runs with the full privileges of whoever installed it. The literal has to look
  like a path or a short command rather than a sentence, since prose that merely
  mentions ~/.ssh is not a package reading it -- but naming one is still not
  proof it is read, so read the line.
# Empty: this rule matches a string literal, not a call, so it
# names no function that do.call() could reach.
functions: []
xpath: >-
  //STR_CONST[
      (
      contains(text(), '.ssh/')
      or contains(text(), '.aws/')
      or contains(text(), '.netrc')
      or contains(text(), '.pgpass')
      or contains(text(), '.docker/config.json')
      or contains(text(), '.config/gcloud')
      or contains(text(), '.kube/config')
      or contains(text(), 'id_rsa')
      or contains(text(), 'id_dsa')
      or contains(text(), 'id_ecdsa')
      or contains(text(), 'id_ed25519')
      or contains(text(), '.gnupg/')
      or contains(text(), 'credentials.json')
      or text() = '".ssh"' or text() = "'.ssh'"
      or text() = '".aws"' or text() = "'.aws'"
      or text() = '".gnupg"' or text() = "'.gnupg'"
      )
      and not(contains(text(), '`'))
      and (not(contains(text(), ' ')) or string-length(text()) < 32)
    ]
    |
    //expr[
      expr/SYMBOL_FUNCTION_CALL[
        text() = 'Sys.getenv' or text() = 'Sys.setenv'
      ]
      and .//STR_CONST[
        contains(text(), 'TOKEN')
        or contains(text(), 'SECRET')
        or contains(text(), 'PASSWORD')
        or contains(text(), 'PASSWD')
        or contains(text(), 'API_KEY')
        or contains(text(), 'APIKEY')
        or contains(text(), 'PRIVATE_KEY')
        or contains(text(), 'ACCESS_KEY')
        or contains(text(), 'CREDENTIAL')
      ]
    ]
positive_examples:
  - |
    key <- readLines("~/.ssh/id_rsa")
  - |
    p <- file.path(Sys.getenv("HOME"), ".ssh", "id_rsa")
  - |
    creds <- readLines("~/.aws/credentials")
  - |
    tok <- Sys.getenv("GITHUB_TOKEN")
  - |
    k <- Sys.getenv("AWS_SECRET_ACCESS_KEY")
  - |
    gpg <- list.files("~/.gnupg/")
negative_examples:
  - |
    doc <- "a path that only holds a secret, such as ~/.ssh/id_rsa"
  - |
    lbl <- c(credentials = "covers `~/.aws/` and `.netrc`")
  - |
    home <- Sys.getenv("HOME")
  - |
    lib <- Sys.getenv("R_LIBS_USER")
  - |
    f <- "data/id_map.csv"
  - |
    msg <- "ssh into the build server first"
  - |
    x <- readLines("inst/extdata/keys.csv")
