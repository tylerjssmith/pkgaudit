name: credentials_environment
version: "0.1.0"
language: R
attck:
  - T1552
message: >-
  Sys.getenv() or Sys.setenv() naming an environment variable whose name marks
  it as a secret -- TOKEN, SECRET, PASSWORD, API_KEY and the like. Sys.getenv()
  with no arguments is also detected, since it returns every environment
  variable at once.
functions:
  - Sys.getenv
xpath: >-
  //expr[
      expr/SYMBOL_FUNCTION_CALL[
        text() = 'Sys.getenv' or text() = 'Sys.setenv'
      ]
      and .//STR_CONST[
        contains(text(), 'TOKEN')
        or contains(text(), 'SECRET')
        or contains(text(), 'PASSWORD')
        or contains(text(), 'PASSWD')
        or contains(text(), 'API_KEY')
        or contains(text(), 'APIKEY')
        or contains(text(), 'PRIVATE_KEY')
        or contains(text(), 'ACCESS_KEY')
        or contains(text(), 'CREDENTIAL')
      ]
    ]
    |
    //expr[
      expr/SYMBOL_FUNCTION_CALL[
        text() = 'Sys.getenv'
        and not(preceding-sibling::OP-DOLLAR)
        and not(preceding-sibling::OP-AT)
      ]
      and count(expr) = 1
    ]
positive_examples:
  - |
    tok <- Sys.getenv("GITHUB_TOKEN")
  - |
    k <- Sys.getenv("AWS_SECRET_ACCESS_KEY")
  - |
    env <- Sys.getenv()
  - |
    print(Sys.getenv())
negative_examples:
  - |
    home <- Sys.getenv("HOME")
  - |
    lib <- Sys.getenv("R_LIBS_USER")
  - |
    getter <- Sys.getenv
