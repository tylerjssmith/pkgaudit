name: indirection_pattern
version: "0.3.0"
type: R
attck:
  - T1027
  - T1059
  - T1195.002
message: >-
  These functions resolve a function by name at runtime. A string-literal target
  is not a call site, so it evades pattern matching, and the namespace
  accessors additionally reach functions a package does not export.
xpath: >-
  //expr[
    expr/SYMBOL_FUNCTION_CALL[
      (
        text() = 'do.call' or text() = 'match.fun'
        or text() = 'getFromNamespace' or text() = 'getExportedValue'
        or text() = 'getAnywhere' or text() = 'getFunction'
      )
      and not(preceding-sibling::OP-DOLLAR)
      and not(preceding-sibling::OP-AT)
    ]
    and expr[preceding-sibling::OP-LEFT-PAREN][1]/STR_CONST
  ]
positive_examples:
  - |
    do.call("system", list("id"))
  - |
    do.call(what = "system", args = list("id"))
  - |
    base::do.call("system", list("id"))
  - |
    match.fun("system")
  - |
    match.fun(FUN = "system")
  - |
    getExportedValue("base", "system")
  - |
    utils::getFromNamespace("system", "base")
  - |
    getFromNamespace(x = "system", ns = "base")
  - |
    getAnywhere("system")
  - |
    getFunction("system")
negative_examples:
  - |
    do.call(fn, args)
  - |
    do.call(handler, list(x))
  - |
    do.call(fn, "system")
  - |
    match.fun(handler)
  - |
    getFromNamespace(fname, pkgname)
  - |
    getFunction(paste0("sys", "tem"))
  - |
    get("system")
  - |
    get(x)
  - |
    foo$do.call("system", list())
  - |
    foo@match.fun("system")
  - |
    foo$getFromNamespace("system", "base")
