name: system_callr
version: "0.3.0"
type: R
attck:
  - T1059
message: >-
  These callr functions start a separate R session or run an R CMD command,
  which may be used to execute arbitrary R code or shell commands outside the
  visible R source.
xpath: >-
  //SYMBOL_FUNCTION_CALL[
    (
      text() = 'r_bg' or text() = 'r_safe' or text() = 'r_copycat'
      or text() = 'r_vanilla' or text() = 'rscript'
      or text() = 'rcmd_bg' or text() = 'rcmd_safe' or text() = 'rcmd_copycat'
    )
    and not(preceding-sibling::OP-DOLLAR)
    and not(preceding-sibling::OP-AT)
  ]
  |
  //SYMBOL_FUNCTION_CALL[
    (
      text() = 'r' or text() = 'rcmd'
    )
    and preceding-sibling::SYMBOL_PACKAGE[
      text() = 'callr'
    ]
  ]
  |
  //expr[
    OP-DOLLAR
    and SYMBOL_FUNCTION_CALL[text() = 'new']
    and .//SYMBOL[
      text() = 'r_session' or text() = 'r_process'
      or text() = 'rcmd_process' or text() = 'rscript_process'
    ]
  ]
positive_examples:
  - |
    callr::r(function() system("id"))
  - |
    callr::r_bg(function() system("id"))
  - |
    r_bg(function() system("id"))
  - |
    callr::r_safe(function() system("id"))
  - |
    callr::r_copycat(function() system("id"))
  - |
    callr::r_vanilla(function() system("id"))
  - |
    callr::rcmd("INSTALL", "evil.tar.gz")
  - |
    callr::rcmd_bg("INSTALL", "evil.tar.gz")
  - |
    rcmd_safe("INSTALL", "evil.tar.gz")
  - |
    callr::rcmd_copycat("INSTALL", "evil.tar.gz")
  - |
    callr::rscript("evil.R")
  - |
    callr::r_session$new()
  - |
    rp <- r_process$new(opts)
  - |
    callr::rcmd_process$new(opts)
negative_examples:
  - |
    r(3)
  - |
    rcmd(args)
  - |
    foo$r(1)
  - |
    foo$new("x")
  - |
    foo@r_safe("x")
