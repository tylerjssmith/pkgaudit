name: on_load_rlang
version: "0.4.0"
language: R
kind: xpath
message: >-
  rlang::on_load() registers arbitrary code to execute when a package namespace
  is loaded, e.g., by calling library(), require(), or loadNamespace(), or by
  accessing the namespace with ::. R CMD INSTALL and R CMD check load the
  package, as does R CMD build when the package has vignettes, so the registered
  code runs during those phases without any call from a user. on_load() requires
  .onLoad() to contain rlang::run_on_load().
# Phases follow .onLoad's: run_on_load() fires the registered code from inside
# .onLoad, so it reaches exactly the phases .onLoad does.
at_autoconf: FALSE
at_build: TRUE
at_check: TRUE
at_install_src: TRUE
at_install_bin: FALSE
at_load: TRUE
at_attach: FALSE
at_unload: FALSE
at_detach: FALSE
xpath: >-
  //expr[
    expr/SYMBOL_FUNCTION_CALL[
      text() = 'on_load'
      and not(preceding-sibling::OP-DOLLAR)
      and not(preceding-sibling::OP-AT)
    ]
  ]
positive_examples:
  - |
    on_load(invisible(NULL))
  - |
    rlang::on_load(invisible(NULL))
  - |
    on_load({
      invisible(NULL)
    })
negative_examples:
  - |
    invisible(NULL)
  - |
    foo$on_load(invisible(NULL))
  - |
    foo@on_load(invisible(NULL))
