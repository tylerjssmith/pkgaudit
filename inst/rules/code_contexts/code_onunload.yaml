name: onUnload_base
version: "0.4.0"
language: R
kind: xpath
message: >-
  .onUnload() executes arbitrary code when a package namespace is unloaded,
  e.g., by calling unloadNamespace() or detach(unload=TRUE). R CMD check unloads
  the namespace while checking that it can be unloaded cleanly, so .onUnload()
  runs during checking without any call from a user.
# Measured with a probe package whose every hook writes a marker: R CMD check
# was the only command that reached it.
at_autoconf: FALSE
at_build: FALSE
at_check: TRUE
at_install_src: FALSE
at_install_bin: FALSE
at_load: FALSE
at_attach: FALSE
at_unload: TRUE
at_detach: FALSE
xpath: >-
  (//expr | //expr_or_assign_or_help)[
    (
      (LEFT_ASSIGN or EQ_ASSIGN)
      and expr[1]/SYMBOL[text() = '.onUnload']
      and expr[FUNCTION]
    )
    or
    (
      RIGHT_ASSIGN
      and expr[2]/SYMBOL[text() = '.onUnload']
      and expr[1]//FUNCTION
    )
  ]
positive_examples:
  - |
    .onUnload <- function(libpath) {
      invisible(NULL)
    }
  - |
    .onUnload = function(libpath) {
      invisible(NULL)
    }
  - |
    (function(libpath) {
      invisible(NULL)
    }) -> .onUnload
negative_examples:
  - |
    invisible(NULL)
  - |
    foo <- function() {
      invisible(NULL)
    }
  - |
    .onDetach <- function(libname, pkgname) {
      invisible(NULL)
    }
  - |
    .onDetach = function(libname, pkgname) {
      invisible(NULL)
    }
  - |
    (function(libname, pkgname) {
      invisible(NULL)
    }) -> .onDetach

