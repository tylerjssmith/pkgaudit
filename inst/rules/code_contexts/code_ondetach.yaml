name: onDetach_base
version: "0.3.0"
language: R
message: >-
  .onDetach() executes arbitrary code when a package is detached from the R
  search path, e.g., by calling detach(); it takes precedence over .Last.lib()
  when both are defined. R CMD check detaches the package while checking that it
  can be unloaded cleanly, so .onDetach() runs during checking without any call
  from a user.
at_autoconf: FALSE
at_build: FALSE
at_check: TRUE
at_install_src: FALSE
at_install_bin: FALSE
at_load: FALSE
at_attach: FALSE
at_unload: FALSE
at_detach: TRUE
xpath: >-
  (//expr | //expr_or_assign_or_help)[
    (
      (LEFT_ASSIGN or EQ_ASSIGN)
      and expr[1]/SYMBOL[text() = '.onDetach']
      and expr[FUNCTION]
    )
    or
    (
      RIGHT_ASSIGN
      and expr[2]/SYMBOL[text() = '.onDetach']
      and expr[1]//FUNCTION
    )
  ]
positive_examples:
  - |
    .onDetach <- function(libpath) {
      invisible(NULL)
    }
  - |
    .onDetach = function(libpath) {
      invisible(NULL)
    }
  - |
    (function(libpath) {
      invisible(NULL)
    }) -> .onDetach
negative_examples:
  - |
    invisible(NULL)
  - |
    foo <- function() {
      invisible(NULL)
    }
  - |
    .onAttach <- function(libname, pkgname) {
      invisible(NULL)
    }
  - |
    .onAttach = function(libname, pkgname) {
      invisible(NULL)
    }
  - |
    (function(libname, pkgname) {
      invisible(NULL)
    }) -> .onAttach

