name: onLoad_base
version: "0.4.0"
language: R
kind: xpath
message: >-
  .onLoad() executes arbitrary code when a package namespace is loaded, e.g.,
  by calling library(), require(), or loadNamespace(), or by accessing the
  namespace with ::. R CMD INSTALL and R CMD check load the package, as does
  R CMD build when the package has vignettes, so .onLoad() runs during those
  phases without any call from a user.
# Measured with a probe package whose every hook writes a marker: at_build
# holds because build installs the package to render vignettes.
at_autoconf: FALSE
at_build: TRUE
at_check: TRUE
at_install_src: TRUE
at_install_bin: FALSE
at_load: TRUE
at_attach: FALSE
at_unload: FALSE
at_detach: FALSE
xpath: >-
  (//expr | //expr_or_assign_or_help)[
    (
      (LEFT_ASSIGN or EQ_ASSIGN)
      and expr[1]/SYMBOL[text() = '.onLoad']
      and expr[FUNCTION]
    )
    or
    (
      RIGHT_ASSIGN
      and expr[2]/SYMBOL[text() = '.onLoad']
      and expr[1]//FUNCTION
    )
  ]
positive_examples:
  - |
    .onLoad <- function(libname, pkgname) {
      invisible(NULL)
    }
  - |
    .onLoad = function(libname, pkgname) {
      invisible(NULL)
    }
  - |
    (function(libname, pkgname) {
      invisible(NULL)
    }) -> .onLoad
negative_examples:
  - |
    invisible(NULL)
  - |
    foo <- function() {
      invisible(NULL)
    }
  - |
    .onAttach <- function(libname, pkgname) {
      invisible(NULL)
    }
  - |
    .onAttach = function(libname, pkgname) {
      invisible(NULL)
    }
  - |
    (function(libname, pkgname) {
      invisible(NULL)
    }) -> .onAttach

