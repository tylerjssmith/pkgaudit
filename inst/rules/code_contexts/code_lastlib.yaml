name: LastLib_base
version: "0.3.0"
type: R
message: >-
  .Last.lib() executes arbitrary code when a package is detached from the R
  search path, e.g., by calling detach(); it does not run on unloadNamespace().
  It runs only if the package exports it and does not define .onDetach(), which
  supersedes it; R CMD check reports "NB: .Last.lib will not be used unless it
  is exported". R CMD check detaches the package while checking that it can be
  unloaded cleanly, so .Last.lib() runs during checking without any call from a
  user.
at_autoconf: FALSE
at_build: FALSE
at_check: TRUE
at_install_src: FALSE
at_install_bin: FALSE
at_load: FALSE
at_attach: FALSE
at_unload: FALSE
at_detach: TRUE
xpath: >-
  (//expr | //expr_or_assign_or_help)[
    (
      (LEFT_ASSIGN or EQ_ASSIGN)
      and expr[1]/SYMBOL[text() = '.Last.lib']
      and expr[FUNCTION]
    )
    or
    (
      RIGHT_ASSIGN
      and expr[2]/SYMBOL[text() = '.Last.lib']
      and expr[1]//FUNCTION
    )
  ]
positive_examples:
  - |
    .Last.lib <- function(libname, pkgname) {
      invisible(NULL)
    }
  - |
    .Last.lib = function(libname, pkgname) {
      invisible(NULL)
    }
  - |
    (function(libname, pkgname) {
      invisible(NULL)
    }) -> .Last.lib
negative_examples:
  - |
    invisible(NULL)
  - |
    foo <- function() {
      invisible(NULL)
    }
  - |
    .onDetach <- function(libname, pkgname) {
      invisible(NULL)
    }
  - |
    .onDetach = function(libname, pkgname) {
      invisible(NULL)
    }
  - |
    (function(libname, pkgname) {
      invisible(NULL)
    }) -> .onDetach

