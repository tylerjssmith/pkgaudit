name: Rd_Sexpr_render
version: "0.1.0"
language: R
kind: segment
segment: Rd_Sexpr_render
message: >-
  \Sexpr[stage=render] is evaluated when the page is rendered for display, not
  when it is installed. It fires during R CMD build and R CMD check, and when a
  user calls help(); it does not fire at either install.
# Established with an instrumented probe package carrying one \Sexpr per stage,
# run through R CMD build, R CMD INSTALL from a directory, a source tarball and
# a binary, R CMD check, and help().
at_autoconf: FALSE
at_build: TRUE
at_check: TRUE
at_install_src: FALSE
at_install_bin: FALSE
at_load: FALSE
at_attach: FALSE
at_unload: FALSE
at_detach: FALSE
positive_examples:
  - |
    \name{probe}
    \alias{probe}
    \title{Probe}
    \description{\Sexpr[stage=render,results=hide]{x <- 1}}
negative_examples:
  - |
    \name{probe}
    \alias{probe}
    \title{Probe}
    \description{\Sexpr[stage=build,results=hide]{x <- 1}}
  - |
    \name{probe}
    \alias{probe}
    \title{Probe}
    \description{No macro at all.}
