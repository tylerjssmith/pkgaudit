name: onAttach_base
version: "0.4.0"
language: R
kind: xpath
message: >-
  .onAttach() executes arbitrary code when a package is attached to the R search
  path by library() or require(); attach() does not trigger it. R CMD INSTALL,
  R CMD build, and R CMD check attach the package while testing that it loads,
  so .onAttach() runs during those phases without any call from a user.
at_autoconf: FALSE
at_build: TRUE
at_check: TRUE
at_install_src: TRUE
at_install_bin: FALSE
at_load: FALSE
at_attach: TRUE
at_unload: FALSE
at_detach: FALSE
xpath: >-
  (//expr | //expr_or_assign_or_help)[
    (
      (LEFT_ASSIGN or EQ_ASSIGN)
      and expr[1]/SYMBOL[text() = '.onAttach']
      and expr[FUNCTION]
    )
    or
    (
      RIGHT_ASSIGN
      and expr[2]/SYMBOL[text() = '.onAttach']
      and expr[1]//FUNCTION
    )
  ]
positive_examples:
  - |
    .onAttach <- function(libname, pkgname) {
      invisible(NULL)
    }
  - |
    .onAttach = function(libname, pkgname) {
      invisible(NULL)
    }
  - |
    (function(libname, pkgname) {
      invisible(NULL)
    }) -> .onAttach
negative_examples:
  - |
    invisible(NULL)
  - |
    foo <- function() {
      invisible(NULL)
    }
  - |
    .onLoad <- function(libname, pkgname) {
      invisible(NULL)
    }
  - |
    .onLoad = function(libname, pkgname) {
      invisible(NULL)
    }
  - |
    (function(libname, pkgname) {
      invisible(NULL)
    }) -> .onLoad

