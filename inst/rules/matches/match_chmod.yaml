name: chmod
version: "0.1.0"
language: shell
attck:
  - T1222
message: >-
  Making a file executable, or setting its setuid or setgid bit, during a
  build turns something the package shipped as data into something that can be
  run -- in the setuid case, with the privileges of whoever owns it rather
  than whoever runs it. A fully permissive umask is matched too: it withholds
  nothing, so everything the build creates afterwards is world-writable.
regex: '(?<=^|[^[:alnum:]_-])(chmod(?=[^[:alnum:]_./-]|$)[^|;&\n]{0,40}?([+][rwXst]*[xs]|[246][0-7]{3}|777)|umask(?=[^[:alnum:]_./-]|$)[[:space:]]+(-S[[:space:]]+)?(0+(?![0-7])|a=rwx|u=rwx,g=rwx,o=rwx))'
positive_examples:
  - |
    chmod +x tools/prepare.sh
  - |
    chmod u+s /usr/local/bin/helper
  - |
    chmod 4755 $(DESTDIR)/bin/helper
  - |
    chmod 6755 $(DESTDIR)/bin/helper
  - |
    chmod 777 /tmp/staging
  - |
      chmod -R +x inst/scripts
  - |
    chmod a+rwx build/tool
  - |
    umask 0
  - |
    umask 000
  - |
    umask u=rwx,g=rwx,o=rwx
negative_examples:
  - |
    chmod 644 README
  - |
    chmod -R 755 doc
  - |
    chmod u+w notes.txt
  - |
    umask 022
  - |
    umask -S u=rwx,g=rx,o=rx
  - |
    # chmod is not used here
  - |
    MODE=0644
