name: demo_scripts
version: "0.4.0"
type: R
message: >-
  A demo runs when a user calls demo(), and R CMD check runs it under
  --run-demo. It ships in the installed package and runs with the user's
  privileges when invoked.
at_autoconf: FALSE
at_build: FALSE
at_check: FALSE
at_install_src: FALSE
at_install_bin: FALSE
at_load: FALSE
at_attach: FALSE
at_unload: FALSE
at_detach: FALSE
path: "demo"
recursive: FALSE
report: FALSE
code_context: computed
assume_called: TRUE
filename: '\.[RrSsq]$'
positive_examples:
  - demo/intro.R
negative_examples:
  - demo/00Index
  - R/intro.R
