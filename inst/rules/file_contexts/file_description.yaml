name: description
version: "0.4.0"
type: other
message: >-
  DESCRIPTION is not inert. Its Authors@R field is R code. R CMD build, check
  and INSTALL refuse to evaluate anything outside person, as.person, c, list,
  paste and paste0, so they are not the exposure. Developer tooling pointed at
  an unpacked source tree is: desc evaluates the field with no allowlist, so
  reading the authors -- or printing a desc object -- runs whatever it holds.
  That is not a lifecycle phase, so this rule declares none. pkgaudit does not
  read the file, so the row records that it can execute and was not examined.
at_autoconf: FALSE
at_build: FALSE
at_check: FALSE
at_install_src: FALSE
at_install_bin: FALSE
at_load: FALSE
at_attach: FALSE
at_unload: FALSE
at_detach: FALSE
path: "."
recursive: FALSE
report: FALSE
code_context: ~
assume_called: ~
filename: '^DESCRIPTION$'
positive_examples:
  - DESCRIPTION
negative_examples:
  - NAMESPACE
  - inst/DESCRIPTION
