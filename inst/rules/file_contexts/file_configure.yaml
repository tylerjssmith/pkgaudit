name: configure
version: "0.3.0"
type: shell
report: TRUE
message: >-
  configure is a shell script used for system-dependent configuration when
  packages are installed from source, including the installs performed by
  R CMD check and by R CMD build when a package has vignettes. It can execute
  arbitrary shell commands.
at_autoconf: FALSE
at_build: TRUE
at_check: TRUE
at_install_src: TRUE
at_install_bin: FALSE
at_load: FALSE
at_attach: FALSE
at_unload: FALSE
at_detach: FALSE
path: "."
recursive: FALSE
pattern: '^configure$'
positive_examples:
  - configure
negative_examples:
  - configure.win
  - tools/configure
  - reconfigure
