name: src_install_libs_R
version: "0.3.0"
type: R
report: TRUE
message: >-
  src/install.libs.R is an R script used in some packages to install executable
  programs and other binaries during installation from source, including the
  installs performed by R CMD check and by R CMD build when a package has
  vignettes. It can run arbitrary R code.
at_autoconf: FALSE
at_build: TRUE
at_check: TRUE
at_install_src: TRUE
at_install_bin: FALSE
at_load: FALSE
at_attach: FALSE
at_unload: FALSE
at_detach: FALSE
path: "src"
recursive: FALSE
pattern: '^install\.libs\.R$'
positive_examples:
  - src/install.libs.R
negative_examples:
  - install.libs.txt
  - tools/install.libs.R
