name: man_pages_unix
version: "0.4.0"
type: Rd
report: FALSE
code_context:
  - Rd_examples
  - Rd_Sexpr_build
  - Rd_Sexpr_install
  - Rd_Sexpr_render
message: >-
  Help files in man/unix carry R code in two places: \examples{}, which R CMD check
  runs, and \Sexpr{}, which is evaluated when the help page is rendered during
  R CMD build and installation from source. They are scanned for patterns; the
  files themselves are not a finding, which is why this rule does not report.
at_autoconf: FALSE
at_build: TRUE
at_check: TRUE
at_install_src: TRUE
at_install_bin: FALSE
at_load: FALSE
at_attach: FALSE
at_unload: FALSE
at_detach: FALSE
path: "man/unix"
recursive: FALSE
filename: '\.[Rr]d$'
positive_examples:
  - man/unix/u.Rd
negative_examples:
  - man/u.Rd
  - man/windows/w.Rd
  - man/unix/notes.txt
