name: vignettes_rmd
version: "0.1.0"
type: Rmd
message: >-
  An R Markdown vignette carries executable chunks. Vignette code runs when the vignette is rendered: during R CMD build,
  and again under R CMD check, which rebuilds it. It executes arbitrary R with
  the package loaded, before anyone reads the rendered document.
at_autoconf: FALSE
at_build: TRUE
at_check: TRUE
at_install_src: FALSE
at_install_bin: FALSE
at_load: FALSE
at_attach: FALSE
at_unload: FALSE
at_detach: FALSE
path: "vignettes"
recursive: FALSE
report: FALSE
namespace_source: FALSE
code_context: "vignette"
filename: '\.[Rr]md$'
positive_examples:
  - vignettes/intro.Rmd
  - vignettes/other.rmd
negative_examples:
  - vignettes/intro.md
  - R/intro.R
