name: cleanup_file
version: "0.3.0"
type: shell
message: >-
  cleanup is a shell script run on Unix-like systems at the end of R CMD build,
  and during installation from source only under R CMD INSTALL --clean or
  --preclean. It can execute arbitrary shell commands.
at_autoconf: FALSE
at_build: TRUE
at_check: FALSE
at_install_src: FALSE
at_install_bin: FALSE
on_load: FALSE
on_attach: FALSE
on_unload: FALSE
on_detach: FALSE
path: "."
recursive: FALSE
pattern: '^cleanup$'
positive_examples:
  - cleanup
negative_examples:
  - configure
  - tools/cleanup
  - cleanup.sh
