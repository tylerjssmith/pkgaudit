name: rprofile
version: "0.4.0"
type: R
message: >-
  R evaluates a .Rprofile found in the working directory when it starts, so a
  .Rprofile at the package root runs before any package is loaded, earlier than
  any other R in the package. It does not survive into a source tarball: R CMD
  build excludes it, so a check of a built package never sees it.
at_autoconf: FALSE
at_build: TRUE
at_check: FALSE
at_install_src: TRUE
at_install_bin: FALSE
at_load: FALSE
at_attach: FALSE
at_unload: FALSE
at_detach: FALSE
path: "."
recursive: FALSE
report: FALSE
code_context: computed
assume_called: TRUE
filename: '^\.Rprofile$'
positive_examples:
  - .Rprofile
negative_examples:
  - .Renviron
  - R/.Rprofile
