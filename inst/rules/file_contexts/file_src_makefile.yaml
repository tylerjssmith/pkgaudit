name: src_makefile
version: "0.3.0"
type: make
message: >-
  src/Makefile is a makefile used to compile code in src/ when a package is
  installed from source, replacing R's default make rules; the installs
  performed by R CMD check and by R CMD build also use it, and R CMD build runs
  its clean target. It is read by make and its recipes execute arbitrary shell
  commands.
at_autoconf: FALSE
at_build: TRUE
at_check: TRUE
at_install_src: TRUE
at_install_bin: FALSE
at_load: FALSE
at_attach: FALSE
at_unload: FALSE
at_detach: FALSE
path: "src"
recursive: FALSE
pattern: '^Makefile$'
positive_examples:
  - src/Makefile
negative_examples:
  - src/Makevars
  - Makefile
  - src/Makefile.txt
