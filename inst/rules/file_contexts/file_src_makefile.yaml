name: src_makefile_file
version: "0.1.0"
type: make
message: >-
  src/Makefile is a makefile used to compile code in src/ when a package is
  installed from source, replacing R's default make rules. It is read by make and
  its recipes execute arbitrary shell commands.
path: "src"
recursive: FALSE
pattern: '^Makefile$'
positive_examples:
  - src/Makefile
negative_examples:
  - src/Makevars
  - Makefile
  - src/Makefile.txt
