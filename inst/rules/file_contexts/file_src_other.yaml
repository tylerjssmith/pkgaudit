name: src_other
version: "0.4.0"
type: other
message: >-
  A file under src/. Everything there is part of what gets built, so this rule
  claims every extension -- alongside any other rule that matches -- and a file
  no language rule recognises is accounted for rather than passed over.
at_autoconf: FALSE
at_build: FALSE
at_check: TRUE
at_install_src: TRUE
at_install_bin: FALSE
at_load: TRUE
at_attach: FALSE
at_unload: FALSE
at_detach: FALSE
path: "src"
recursive: TRUE
report: FALSE
code_context: ~
assume_called: ~
filename: '.'
positive_examples:
  - src/vendor/odd.zz
  - src/build.ninja
  - src/init.c
negative_examples:
  - R/zzz.R
  - inst/include/Rcpp/Vector.h
