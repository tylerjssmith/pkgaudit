name: data_serialized
version: "0.5.0"
type: other
message: >-
  A serialized R object under data/ is restored when the package's data is
  loaded. Deserializing an .rda or .rds can execute arbitrary code, and
  pkgaudit cannot inspect one, so it is recorded rather than passed over as
  inert data.
at_autoconf: FALSE
at_build: FALSE
at_check: TRUE
at_install_src: TRUE
at_install_bin: FALSE
at_load: TRUE
at_attach: FALSE
at_unload: FALSE
at_detach: FALSE
path: "data"
recursive: FALSE
report: FALSE
code_context: ~
filename: '\.(rda|RData|Rdata|rdata|rds|RDS|Rds)$'
positive_examples:
  - data/cities.rda
  - data/small.RData
  - data/m.rds
negative_examples:
  - data/things.R
  - data/notes.csv
  - inst/extdata/m.rds
