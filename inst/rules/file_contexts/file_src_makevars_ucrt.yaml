name: src_makevars_ucrt
version: "0.3.0"
type: make
report: TRUE
namespace_source: FALSE
code_context: "Top-level"
message: >-
  src/Makevars.ucrt sets make variables used to compile code in src/ on the
  Windows UCRT toolchain when a package is installed from source, including the
  installs performed by R CMD check and by R CMD build; it takes precedence over
  Makevars.win, and R CMD build also reads it when cleaning src/. It is read by
  make and can execute shell via make constructs such as $(shell ...).
at_autoconf: FALSE
at_build: TRUE
at_check: TRUE
at_install_src: TRUE
at_install_bin: FALSE
at_load: FALSE
at_attach: FALSE
at_unload: FALSE
at_detach: FALSE
path: "src"
recursive: FALSE
filename: '^Makevars\.ucrt$'
positive_examples:
  - src/Makevars.ucrt
negative_examples:
  - src/Makevars.win
  - Makevars.ucrt
  - src/Makevars.ucrtx
