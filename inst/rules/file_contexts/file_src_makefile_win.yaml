name: src_makefile_win_file
version: "0.3.0"
type: make
message: >-
  src/Makefile.win is a makefile used to compile code in src/ on Windows when a
  package is installed from source, replacing R's default make rules; the
  installs performed by R CMD check and by R CMD build also use it, and R CMD
  build runs its clean target. It is read by make and its recipes execute
  arbitrary shell commands.
at_autoconf: FALSE
at_build: TRUE
at_check: TRUE
at_install_src: TRUE
at_install_bin: FALSE
on_load: FALSE
on_attach: FALSE
on_unload: FALSE
on_detach: FALSE
path: "src"
recursive: FALSE
pattern: '^Makefile\.win$'
positive_examples:
  - src/Makefile.win
negative_examples:
  - src/Makefile
  - Makefile.win
  - src/Makefile.winx
