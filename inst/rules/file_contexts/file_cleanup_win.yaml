name: cleanup_win
version: "0.3.0"
type: shell
report: TRUE
message: >-
  cleanup.win is a shell script run on Windows at the end of R CMD build, and
  during installation from source only under R CMD INSTALL --clean or
  --preclean. It can execute arbitrary shell commands.
at_autoconf: FALSE
at_build: TRUE
at_check: FALSE
at_install_src: FALSE
at_install_bin: FALSE
at_load: FALSE
at_attach: FALSE
at_unload: FALSE
at_detach: FALSE
path: "."
recursive: FALSE
pattern: '^cleanup\.win$'
positive_examples:
  - cleanup.win
negative_examples:
  - cleanup
  - tools/cleanup.win
  - cleanup.winx
