name: configure_ucrt
version: "0.4.0"
type: shell
report: TRUE
code_context: ~
assume_called: ~
message: >-
  configure.ucrt is a shell script for system-dependent configuration on the
  Windows UCRT toolchain, executed when a package is installed from source,
  including the installs performed by R CMD check and by R CMD build when a
  package has vignettes; it takes precedence over configure.win when present. It
  can execute arbitrary shell commands.
at_autoconf: FALSE
at_build: TRUE
at_check: TRUE
at_install_src: TRUE
at_install_bin: FALSE
at_load: FALSE
at_attach: FALSE
at_unload: FALSE
at_detach: FALSE
path: "."
recursive: FALSE
filename: '^configure\.ucrt$'
positive_examples:
  - configure.ucrt
negative_examples:
  - configure.win
  - tools/configure.ucrt
  - reconfigure.ucrt
