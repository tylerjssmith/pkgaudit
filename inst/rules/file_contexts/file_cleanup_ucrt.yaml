name: cleanup_ucrt
version: "0.5.0"
type: shell
report: TRUE
code_context: ~
message: >-
  cleanup.ucrt is a shell script run on the Windows UCRT toolchain at the end of
  R CMD build, and during installation from source only under R CMD INSTALL
  --clean or --preclean; it takes precedence over cleanup.win when present. It
  can execute arbitrary shell commands.
at_autoconf: FALSE
at_build: TRUE
at_check: FALSE
at_install_src: FALSE
at_install_bin: FALSE
at_load: FALSE
at_attach: FALSE
at_unload: FALSE
at_detach: FALSE
path: "."
recursive: FALSE
filename: '^cleanup\.ucrt$'
positive_examples:
  - cleanup.ucrt
negative_examples:
  - cleanup.win
  - tools/cleanup.ucrt
  - cleanup.ucrtx
