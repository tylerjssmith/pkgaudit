name: exec_other
version: "0.4.0"
type: other
message: >-
  A script under exec/ in a language pkgaudit does not read ships in the
  installed package and is marked executable. A lifecycle command does not
  necessarily run it, but it executes with the user's privileges when invoked.
  Only certain file extensions are covered by this rule.
at_autoconf: FALSE
at_build: FALSE
at_check: FALSE
at_install_src: FALSE
at_install_bin: FALSE
at_load: FALSE
at_attach: FALSE
at_unload: FALSE
at_detach: FALSE
path: "exec"
recursive: FALSE
report: FALSE
code_context: ~
assume_called: ~
filename: '\.(py|pl|rb|bat|ps1|tcl|lua)$'
positive_examples:
  - exec/build.py
  - exec/tool.pl
  - exec/run.bat
negative_examples:
  - exec/script.R
  - exec/script.sh
