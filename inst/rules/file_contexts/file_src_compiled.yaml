name: src_compiled
version: "0.4.0"
type: other
message: >-
  Compiled source is built into a package's shared object by R CMD INSTALL and
  loaded with the namespace. pkgaudit does not read it; the row exists so the
  file is accounted for, and export_unscanned() can hand it to a tool that does.
  The extensions are listed rather than left to the directory, so that compiled
  source shipped anywhere else -- a header library under inst/include/, say --
  is accounted for too.
at_autoconf: FALSE
at_build: FALSE
at_check: TRUE
at_install_src: TRUE
at_install_bin: FALSE
at_load: TRUE
at_attach: FALSE
at_unload: FALSE
at_detach: FALSE
path: "src"
recursive: TRUE
report: FALSE
code_context: ~
filename: '\.(c|cc|cpp|cxx|C|h|hpp|hxx|ipp|f|f90|f95|f03|f77|for|m|mm|rs|java)$'
positive_examples:
  - src/rcpp_hello.cpp
  - src/init.c
  - src/vendor/zlib/gz.c
  - src/lib.rs
negative_examples:
  - R/zzz.R
  - src/Makevars
  - src/README
