name: r_sysdata
version: "0.4.0"
type: other
message: >-
  R/sysdata.rda holds a package's internal objects and is restored into the
  namespace when the package loads. Deserializing it can execute arbitrary
  code, and pkgaudit cannot inspect it.
at_autoconf: FALSE
at_build: FALSE
at_check: TRUE
at_install_src: TRUE
at_install_bin: FALSE
at_load: TRUE
at_attach: FALSE
at_unload: FALSE
at_detach: FALSE
path: "R"
recursive: FALSE
report: FALSE
code_context: ~
filename: '^sysdata\.rda$'
positive_examples:
  - R/sysdata.rda
negative_examples:
  - R/zzz.R
  - data/cities.rda
