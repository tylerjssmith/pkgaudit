name: src_makevars_in
version: "0.3.0"
type: make
report: TRUE
message: >-
  src/Makevars.in is a template that does not itself execute; it is processed by
  the configure script to generate src/Makevars, whose contents are then read by
  make to compile code in src/ when a package is installed from source,
  including the installs performed by R CMD check and by R CMD build.
at_autoconf: FALSE
at_build: TRUE
at_check: TRUE
at_install_src: TRUE
at_install_bin: FALSE
at_load: FALSE
at_attach: FALSE
at_unload: FALSE
at_detach: FALSE
path: "src"
recursive: FALSE
pattern: '^Makevars\.in$'
positive_examples:
  - src/Makevars.in
negative_examples:
  - src/Makevars
  - Makevars.in
  - src/Makevars.inx
