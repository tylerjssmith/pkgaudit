name: exec_scripts_R
version: "0.4.0"
type: R
message: >-
  R scripts under exec/ ship in the installed package and are marked executable.
  A lifecycle command does not necessarily run them, but they execute with the
  user's privileges when invoked.
at_autoconf: FALSE
at_build: FALSE
at_check: FALSE
at_install_src: FALSE
at_install_bin: FALSE
at_load: FALSE
at_attach: FALSE
at_unload: FALSE
at_detach: FALSE
path: "exec"
recursive: FALSE
report: FALSE
code_context: computed
assume_called: TRUE
filename: '\.[RrSsq]$'
positive_examples:
  - exec/tokenize.R
  - exec/benchmark.r
negative_examples:
  - exec/run.sh
  - exec/encode.pl
  - R/tokenize.R
