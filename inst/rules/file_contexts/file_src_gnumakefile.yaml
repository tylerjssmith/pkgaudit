name: src_gnumakefile_file
version: "0.1.0"
type: make
message: >-
  src/GNUmakefile is a makefile used to compile code in src/ when a package is
  installed from source; GNU make reads it in preference to Makefile. It is read
  by make and its recipes execute arbitrary shell commands.
path: "src"
recursive: FALSE
pattern: '^GNUmakefile$'
positive_examples:
  - src/GNUmakefile
negative_examples:
  - src/Makefile
  - GNUmakefile
  - src/GNUmakefile.txt
