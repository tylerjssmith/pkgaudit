name: configure_in
version: "0.4.0"
type: shell
report: TRUE
code_context: ~
assume_called: ~
message: >-
  configure.in is a legacy-named Autoconf input file that does not itself
  execute; it is processed by Autoconf to generate the configure script, which
  executes shell commands when a package is installed from source.
at_autoconf: TRUE
at_build: FALSE
at_check: FALSE
at_install_src: FALSE
at_install_bin: FALSE
at_load: FALSE
at_attach: FALSE
at_unload: FALSE
at_detach: FALSE
path: "."
recursive: FALSE
filename: '^configure\.in$'
positive_examples:
  - configure.in
negative_examples:
  - configure
  - tools/configure.in
  - configure.inx
