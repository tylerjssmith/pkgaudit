name: configure_win
version: "0.3.0"
type: shell
report: TRUE
namespace_source: FALSE
code_context: "R"
message: >-
  configure.win is a shell script for system-dependent configuration on Windows,
  executed when a package is installed from source, including the installs
  performed by R CMD check and by R CMD build when a package has vignettes.
at_autoconf: FALSE
at_build: TRUE
at_check: TRUE
at_install_src: TRUE
at_install_bin: FALSE
at_load: FALSE
at_attach: FALSE
at_unload: FALSE
at_detach: FALSE
path: "."
recursive: FALSE
filename: '^configure\.win$'
positive_examples:
  - configure.win
negative_examples:
  - configure
  - tools/configure.win
  - reconfigure.win
