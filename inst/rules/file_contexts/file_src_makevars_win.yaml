name: src_makevars_win
version: "0.3.0"
type: make
message: >-
  src/Makevars.win sets make variables used to compile code in src/ on Windows
  when a package is installed from source, including the installs performed by
  R CMD check and by R CMD build; R CMD build also reads it when cleaning src/.
  It is read by make and can execute shell via make constructs such as
  $(shell ...).
at_autoconf: FALSE
at_build: TRUE
at_check: TRUE
at_install_src: TRUE
at_install_bin: FALSE
at_load: FALSE
at_attach: FALSE
at_unload: FALSE
at_detach: FALSE
path: "src"
recursive: FALSE
pattern: '^Makevars\.win$'
positive_examples:
  - src/Makevars.win
negative_examples:
  - src/Makevars
  - Makevars.win
  - src/Makevars.winx
