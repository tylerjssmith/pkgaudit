name: configure_ac_file
version: "0.3.0"
type: shell
message: >-
  configure.ac is an Autoconf input file that does not itself execute; it is
  processed by Autoconf to generate the configure script, which executes shell
  commands when a package is installed from source.
at_autoconf: TRUE
at_build: FALSE
at_check: FALSE
at_install_src: FALSE
at_install_bin: FALSE
on_load: FALSE
on_attach: FALSE
on_unload: FALSE
on_detach: FALSE
path: "."
recursive: FALSE
pattern: '^configure\.ac$'
positive_examples:
  - configure.ac
negative_examples:
  - configure
  - tools/configure.ac
  - configure.acx
