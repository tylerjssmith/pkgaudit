name: src_makevars
version: "0.4.0"
type: make
report: TRUE
code_context: ~
assume_called: ~
message: >-
  src/Makevars sets make variables used to compile code in src/ when a package
  is installed from source, including the installs performed by R CMD check and
  by R CMD build; R CMD build also reads it when cleaning src/. It is read by
  make and can execute shell via make constructs such as $(shell ...).
at_autoconf: FALSE
at_build: TRUE
at_check: TRUE
at_install_src: TRUE
at_install_bin: FALSE
at_load: FALSE
at_attach: FALSE
at_unload: FALSE
at_detach: FALSE
path: "src"
recursive: FALSE
filename: '^Makevars$'
positive_examples:
  - src/Makevars
negative_examples:
  - src/Makefile
  - Makevars
  - src/Makevars.txt
