# Phases for a code context that is computed rather than rule-matched.
#
# Code in a \Sexpr{} macro is evaluated when a help page is processed, which
# happens during R CMD build, during installation from source, and during
# R CMD check. It does not run on installation from a binary package, whose
# help is already rendered, and never at load or attach.
#
# pkgaudit does not read the stage= option, so this context covers every stage
# a \Sexpr can declare. The phases are therefore the union across stages, which
# is the conservative reading: an expression is reported as running in a phase
# if any stage would run it there.
#
# Established by running an instrumented package -- one whose every Rd
# execution site writes a marker file -- through each lifecycle command.
# R CMD build evaluated every stage, including render; installation from source
# evaluated the default and install stages; installation from a prebuilt binary
# evaluated none.
context: "Rd_Sexpr"
version: "0.1.0"
at_autoconf: FALSE
at_build: TRUE
at_check: TRUE
at_install_src: TRUE
at_install_bin: FALSE
at_load: FALSE
at_attach: FALSE
at_unload: FALSE
at_detach: FALSE
