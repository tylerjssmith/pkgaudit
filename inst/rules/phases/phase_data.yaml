# Phases for a code context that is computed rather than rule-matched.
#
# A .R file under data/ is evaluated when R CMD build converts data/ to a
# lazy-load database, and when the package is installed from a source
# directory. It is NOT reached from a source tarball: build replaces the .R
# file with the .rda it produced, so by then there is nothing left to run.
#
# Established with an instrumented probe package: every execution site writes
# a marker, and the package is run through R CMD build (with and without
# --no-build-vignettes), R CMD INSTALL from a directory, a source tarball and a
# binary, R CMD check, loadNamespace(), library(), detach() and unload.
context: "data"
version: "0.1.0"
at_autoconf: FALSE
at_build: TRUE
at_check: FALSE
at_install_src: TRUE
at_install_bin: FALSE
at_load: FALSE
at_attach: FALSE
at_unload: FALSE
at_detach: FALSE
