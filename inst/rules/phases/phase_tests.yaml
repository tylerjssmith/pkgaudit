# Phases for a code context that is computed rather than rule-matched.
#
# Test code is run by R CMD check and by nothing else. This covers tests/*.R,
# tests/testthat/ and inst/tinytest/ alike: all three are reached through a
# runner in tests/, which only check executes. Measured directly for the plain
# and testthat layouts, and for tinytest via its own runner.
#
# Established with an instrumented probe package: every execution site writes
# a marker, and the package is run through R CMD build (with and without
# --no-build-vignettes), R CMD INSTALL from a directory, a source tarball and a
# binary, R CMD check, loadNamespace(), library(), detach() and unload.
context: "tests"
version: "0.1.0"
at_autoconf: FALSE
at_build: FALSE
at_check: TRUE
at_install_src: FALSE
at_install_bin: FALSE
at_load: FALSE
at_attach: FALSE
at_unload: FALSE
at_detach: FALSE
