# Phases for a code context that is computed rather than rule-matched.
#
# \Sexpr[stage=install], and an unlabelled \Sexpr, which Writing R Extensions
# gives install as the default for and which measured identically. Evaluated
# whenever the help page is rendered from source: build, either install, and
# check. Not on installation from a binary, whose help ships pre-rendered.
#
# Established with an instrumented probe package carrying one \Sexpr per
# stage, run through R CMD build, R CMD INSTALL from a directory, a source
# tarball and a binary, R CMD check, and help().
context: "Rd_Sexpr_install"
version: "0.1.0"
at_autoconf: FALSE
at_build: TRUE
at_check: TRUE
at_install_src: TRUE
at_install_bin: FALSE
at_load: FALSE
at_attach: FALSE
at_unload: FALSE
at_detach: FALSE
