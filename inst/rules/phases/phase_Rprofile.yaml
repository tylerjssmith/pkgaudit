# Phases for a code context that is computed rather than rule-matched.
#
# R evaluates a .Rprofile found in the working directory at startup, so a
# package-root .Rprofile is reached whenever a lifecycle command starts an R
# process inside the package: R CMD build, and installation from a source
# directory.
#
# Established with an instrumented probe package: every execution site writes
# a marker, and the package is run through R CMD build (with and without
# --no-build-vignettes), R CMD INSTALL from a directory, a source tarball and a
# binary, R CMD check, loadNamespace(), library(), detach() and unload.
context: "Rprofile"
version: "0.1.0"
at_autoconf: FALSE
at_build: TRUE
at_check: FALSE
at_install_src: TRUE
at_install_bin: FALSE
at_load: FALSE
at_attach: FALSE
at_unload: FALSE
at_detach: FALSE
